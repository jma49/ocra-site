<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 560" width="1376" height="560"><style>
.col{animation:bob var(--d) ease-in-out var(--w) infinite alternate}
.eye{transform-box:fill-box;transform-origin:center;animation:look 9s ease-in-out var(--w) infinite}
.eye ellipse{transform-box:fill-box;transform-origin:center;animation:blink 7s linear var(--b) infinite}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(var(--a))}}
@keyframes look{0%,18%{transform:translateX(0)}24%,46%{transform:translateX(var(--l))}52%,70%{transform:translateX(calc(var(--l) * -0.8))}76%,100%{transform:translateX(0)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.08)}}
@media (prefers-reduced-motion:reduce){.col,.eye,.eye ellipse{animation:none}}
