version: 2
# npm packages are pinned to exact versions and actions by commit SHA;
# Dependabot proposes the new version (for actions, the SHA with its version
# comment). A release is adopted a week after it is published, when a
# compromised version has usually been found and pulled (as in the engine).
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
