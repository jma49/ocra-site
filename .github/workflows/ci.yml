name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
        env:
          MANUAL_SOURCE: remote

  # Conventional Commits, with the engine's own rules (AGENTS.md, Git
  # workflow). Pinned to an engine commit, so a push
  # to the engine's main does not change this repository's CI; Dependabot
  # proposes the next release.
  commits:
    if: github.event_name == 'pull_request'
    uses: ocrahq/Open-CR-Agent/.github/workflows/commits.yml@5e21d4f2227e5d14f517e7bac7f5e5384c24d184 # allow co-author trailers

  # CI's time budgets (the engine's docs/ci.md): fails the run when a job
  # set up or ran longer than its ceiling in .github/ci-budgets.json.
  budget:
    needs: [verify, commits]
    if: ${{ !cancelled() }}
    permissions:
      actions: read
      contents: read
    uses: ocrahq/Open-CR-Agent/.github/workflows/budget.yml@c07fd436960f9dfa1f2ccc2713525245ec70c4d1 # main after v0.9.0 (job.workflow_sha)
