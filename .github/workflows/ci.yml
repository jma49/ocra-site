name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
        env:
          MANUAL_SOURCE: remote

  # Conventional Commits and no AI attribution, with the engine's own checks
  # (AGENTS.md, Working with agents). Pinned to an engine release, so a push
  # to the engine's main does not change this repository's CI; Dependabot
  # proposes the next release.
  commits:
    if: github.event_name == 'pull_request'
    uses: jma49/Open-CR-Agent/.github/workflows/commits.yml@38bf9e5453cf0d452fe39fd027cef34d2c0e4ea7 # main after v0.6.0 (job.workflow_sha)
