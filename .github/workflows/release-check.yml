name: Release check

on: workflow_dispatch

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: site
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ocrahq/Open-CR-Agent
          ref: main
          path: engine
          persist-credentials: false
      - name: Record the revisions under test
        run: |
          printf 'Site: %s\n\nEngine: %s\n' \
            "$(git rev-parse HEAD)" "$(git -C ../engine rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run verify
        env:
          OCRA_DIR: ${{ github.workspace }}/engine
          MANUAL_DIR: ${{ github.workspace }}/engine/docs/manual
